<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .admin-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { font-size: 22px; margin-bottom: 12px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        .btn-share {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn-share:hover { background: #0369a1; }
        .status-badge {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            background: #334155;
            color: #f59e0b;
        }
        .active { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Live Class - Admin Control</h2>
        <p>Zoom Window එක Screen Share කිරීමට පහත Button එක ක්ලික් කරන්න. <b>"Share system audio"</b> ටික් එක On කිරීමට අමතක නොකරන්න.</p>
        
        <button class="btn-share" onclick="startBroadcasting()">Start Sharing Zoom</button>
        
        <div class="status-badge" id="statusBox">Status: Offline (Not Sharing)</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer;
        let localStream;

        function startBroadcasting() {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                
                const statusBox = document.getElementById('statusBox');
                statusBox.innerText = 'Status: Live Broadcasting Active!';
                statusBox.classList.add('active');

                // Host එක සඳහා භාවිත වන නිශ්චිත ID එක
                peer = new Peer('my-zoom-class-master-stream');

                peer.on('open', id => {
                    console.log('Broadcaster Peer ID:', id);
                });

                peer.on('call', call => {
                    call.answer(localStream); // බලන්න එන පාරිභෝගිකයින්ට Stream එක ලබාදීම
                });

                // User Screen Share එක නතර කළ විට
                stream.getVideoTracks()[0].onended = () => {
                    statusBox.innerText = 'Status: Stream Stopped';
                    statusBox.classList.remove('active');
                };

            }).catch(err => {
                alert('Screen Share Canceled or Failed: ' + err.message);
            });
        }
    </script>
</body>
</html>
