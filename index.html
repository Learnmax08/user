<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 35px; border-radius: 16px; width: 90%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #0369a1; }
        #status { margin-top: 20px; font-size: 14px; font-weight: bold; color: #f59e0b; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Class Admin Control</h2>
        <p>Zoom Window එක Select කර <b>"Share system audio"</b> ඔප්ෂන් එක අනිවාර්යයෙන්ම ටික් කරන්න.</p>
        <button onclick="startBroadcasting()">Start Sharing Zoom</button>
        <div id="status">Status: Offline</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer = null;
        let localStream = null;

        function startBroadcasting() {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                
                const status = document.getElementById('status');
                status.innerText = 'Status: Live Stream Active!';
                status.style.color = '#22c55e';

                // Static Peer ID for learnmax08
                peer = new Peer('learnmax08-zoom-master-stream-v1');

                peer.on('open', id => {
                    console.log('Host Ready:', id);
                });

                peer.on('call', call => {
                    call.answer(localStream);
                });

                stream.getVideoTracks()[0].onended = () => {
                    status.innerText = 'Status: Stream Stopped';
                    status.style.color = '#ef4444';
                    if (peer) peer.destroy();
                };

            }).catch(err => {
                alert('Screen Share Error: ' + err.message);
            });
        }
    </script>
</body>
</html>
