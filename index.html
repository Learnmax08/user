<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #050b14; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; }
        
        .offline { color: #fff; text-align: center; position: absolute; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        .wave-container { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }

        .wave { position: absolute; border: 2px solid #38bdf8; border-radius: 50%; opacity: 0; animation: ripple 2.5s infinite cubic-bezier(0, 0.2, 0.8, 1); }
        .wave:nth-child(2) { animation-delay: 0.8s; }
        .wave:nth-child(3) { animation-delay: 1.6s; }

        .center-dot { width: 20px; height: 20px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 20px #38bdf8, 0 0 40px #38bdf8; z-index: 2; }

        @keyframes ripple {
            0% { width: 20px; height: 20px; opacity: 1; }
            100% { width: 140px; height: 140px; opacity: 0; }
        }

        .offline-title { font-size: 22px; font-weight: 600; color: #f1f5f9; margin-bottom: 8px; }
        .offline-subtitle { font-size: 14px; color: #64748b; background: rgba(255, 255, 255, 0.05); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); }

        video { width: 100vw; height: 100vh; object-fit: contain; background: #000; position: absolute; top:0; left:0; z-index: 2; }
        
        .player-controls {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            padding: 8px 14px; border-radius: 30px; display: flex; align-items: center; gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .ctrl-btn { background: none; border: none; color: #38bdf8; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: 0.2s; }
        .ctrl-btn:hover { transform: scale(1.1); }
        .volume-slider { width: 70px; accent-color: #38bdf8; cursor: pointer; }
        .divider { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.2); }
        .play-btn { position: absolute; z-index: 12; background: #38bdf8; color: #000; padding: 14px 28px; border-radius: 30px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body>

    <div class="player-controls" id="controlsWidget" style="display: none;">
        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        <div class="divider"></div>
        <button class="ctrl-btn" id="fsBtn" onclick="toggleFullScreen()" title="Full Screen">⛶</button>
    </div>

    <div class="offline" id="offlineUI">
        <div class="wave-container">
            <div class="center-dot"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        <div class="offline-title">Waiting for Live Stream...</div>
        <div class="offline-subtitle">Admin විසින් Stream එක සක්‍රිය කළ සැනින් මෙහි පෙනෙනු ඇත.</div>
    </div>

    <div class="play-btn" id="playBtn" onclick="playVideo()">▶ Click Here to Watch Stream</div>

    <video id="remoteVideo" autoplay playsinline></video>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const STREAM_KEY = 'learnmax08-final-stable-key-2026';
        let peer = null;
        let activeCall = null;

        const video = document.getElementById('remoteVideo');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const controlsWidget = document.getElementById('controlsWidget');
        const fsBtn = document.getElementById('fsBtn');

        function initUserPeer() {
            peer = new Peer(null, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                connectToAdmin();
            });

            peer.on('error', err => {
                console.log('User Connection Retry...');
                setTimeout(connectToAdmin, 2000);
            });
        }

        function connectToAdmin() {
            if (activeCall || !peer || peer.destroyed || !peer.open) return;

            const call = peer.call(STREAM_KEY, null);
            if (!call) return;

            call.on('stream', remoteStream => {
                activeCall = call;
                document.getElementById('offlineUI').style.display = 'none';
                controlsWidget.style.display = 'flex';
                video.srcObject = remoteStream;
                
                video.play().catch(() => {
                    document.getElementById('playBtn').style.display = 'block';
                });
            });

            call.on('close', disconnect);
            call.on('error', disconnect);
        }

        function playVideo() {
            video.play();
            document.getElementById('playBtn').style.display = 'none';
        }

        function disconnect() {
            activeCall = null;
            video.srcObject = null;
            document.getElementById('offlineUI').style.display = 'flex';
            document.getElementById('playBtn').style.display = 'none';
            controlsWidget.style.display = 'none';
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.innerText = video.muted ? '🔇' : '🔊';
            volumeSlider.value = video.muted ? 0 : (video.volume || 1);
        }

        function changeVolume(val) {
            video.volume = val;
            video.muted = (val == 0);
            muteBtn.innerText = (val == 0) ? '🔇' : '🔊';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fsBtn.innerText = '🗗';
            } else {
                document.exitFullscreen();
                fsBtn.innerText = '⛶';
            }
        }

        setInterval(() => {
            if (!activeCall && peer && peer.open) {
                connectToAdmin();
            }
        }, 3000);

        initUserPeer();
    </script>
</body>
</html>
